name: Update profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
      - master
    paths:
      - "scripts/update_profile_stats.py"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-activity-sync
  cancel-in-progress: true

jobs:
  update-profile-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate local GitHub activity SVGs
        env:
          PROFILE_USERNAME: FatemehDehghan224
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python3 scripts/update_profile_stats.py

      - name: Commit only when the data changed
        shell: bash
        run: |
          if git diff --quiet -- assets/github-stats.svg assets/github-activity.svg; then
            echo "Profile activity is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-activity.svg
          git commit -m "chore: refresh profile activity [skip ci]"
          git push
