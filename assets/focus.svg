<svg width="1200" height="178" viewBox="0 0 1200 178" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="accent" x1="70" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#8B5CF6"/>
    <stop offset=".52" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#F472B6"/>
  </linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(995 90) rotate(180) scale(300 125)">
    <stop stop-color="#22D3EE" stop-opacity=".13"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>

<rect x="1" y="1" width="1198" height="176" rx="24" fill="#0A0F1D" stroke="#25304A" stroke-width="2"/>
<rect x="1" y="1" width="1198" height="176" rx="24" fill="url(#glow)"/>

<text x="58" y="54" fill="#78879D" font-size="12" font-weight="700" letter-spacing="2.1" font-family="Inter,Segoe UI,Arial,sans-serif">A SMALL NOTE ABOUT HOW I BUILD</text>
<text x="58" y="96" fill="#F8FAFC" font-size="25" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">I care about the part after the demo —</text>
<text x="58" y="128" fill="url(#accent)" font-size="25" font-weight="750" font-family="Inter,Segoe UI,Arial,sans-serif">making AI useful, reliable, and shippable.</text>

<!-- minimal animated pipeline -->
<g transform="translate(820 54)">
  <text x="0" y="-10" fill="#64748B" font-size="11" letter-spacing="1.3" font-family="JetBrains Mono,Consolas,monospace">PROTOTYPE → PRODUCT</text>
  <path d="M18 42H264" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <circle cx="18" cy="42" r="9" fill="#10182A" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="100" cy="42" r="9" fill="#10182A" stroke="#64748B" stroke-width="2"/>
  <circle cx="182" cy="42" r="9" fill="#10182A" stroke="#64748B" stroke-width="2"/>
  <circle cx="264" cy="42" r="9" fill="#10182A" stroke="#F472B6" stroke-width="2"/>
  <circle r="5" fill="#22D3EE" filter="url(#g)">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M18 42H264"/>
  </circle>
  <text x="9" y="75" fill="#66758A" font-size="10" font-family="JetBrains Mono,Consolas,monospace">idea</text>
  <text x="83" y="75" fill="#66758A" font-size="10" font-family="JetBrains Mono,Consolas,monospace">test</text>
  <text x="160" y="75" fill="#66758A" font-size="10" font-family="JetBrains Mono,Consolas,monospace">refine</text>
  <text x="246" y="75" fill="#A78BFA" font-size="10" font-family="JetBrains Mono,Consolas,monospace">ship</text>
</g>

<rect x="58" y="154" width="1084" height="2" rx="1" fill="url(#accent)" opacity=".45">
  <animate attributeName="opacity" values=".25;.8;.25" dur="5s" repeatCount="indefinite"/>
</rect>
</svg>
