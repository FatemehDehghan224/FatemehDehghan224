<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="40" y1="10" x2="1160" y2="410" gradientUnits="userSpaceOnUse">
    <stop stop-color="#070B16"/>
    <stop offset="0.5" stop-color="#0D1427"/>
    <stop offset="1" stop-color="#080C17"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#8B5CF6"/>
    <stop offset="0.5" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#F472B6"/>
    <animate attributeName="x1" values="-0.25;0.35;-0.25" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0.75;1.35;0.75" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(1025 92) rotate(135) scale(310 235)">
    <stop stop-color="#7C3AED" stop-opacity=".38"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(320 410) rotate(-20) scale(400 210)">
    <stop stop-color="#0891B2" stop-opacity=".23"/>
    <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <filter id="tinyGlow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <clipPath id="clip">
    <rect width="1200" height="420" rx="28"/>
  </clipPath>
</defs>

<g clip-path="url(#clip)">
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#violetGlow)"/>
  <rect width="1200" height="420" fill="url(#cyanGlow)"/>

  <!-- subtle grid -->
  <g opacity=".095" stroke="#94A3B8" stroke-width="1">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/>
    <path d="M100 0V420M200 0V420M300 0V420M400 0V420M500 0V420M600 0V420M700 0V420M800 0V420M900 0V420M1000 0V420M1100 0V420"/>
  </g>

  <!-- scanning light -->
  <rect x="-180" y="0" width="150" height="420" fill="url(#accent)" opacity=".055" transform="skewX(-14)">
    <animate attributeName="x" values="-240;1280" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- orbital AI signal -->
  <g transform="translate(1000 210)">
    <ellipse rx="142" ry="142" stroke="#334155" stroke-width="1.2" stroke-dasharray="5 11" opacity=".65">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="106" ry="106" stroke="#22D3EE" stroke-opacity=".32" stroke-width="1.5" stroke-dasharray="2 13">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="72" ry="72" stroke="#8B5CF6" stroke-opacity=".36" stroke-width="1.4" stroke-dasharray="8 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </ellipse>

    <g stroke="url(#accent)" stroke-width="1.5" opacity=".65">
      <path d="M-125 -42L-55 -83L12 -61L77 -100L121 -34L94 48L24 91L-49 74L-112 34Z"/>
      <path d="M-125 -42L24 91M-55 -83L94 48M12 -61L-49 74M77 -100L-112 34" opacity=".35"/>
    </g>

    <g fill="#0B1020" stroke="url(#accent)" stroke-width="2.5">
      <circle cx="-125" cy="-42" r="7"/>
      <circle cx="-55" cy="-83" r="6"/>
      <circle cx="12" cy="-61" r="8"/>
      <circle cx="77" cy="-100" r="6"/>
      <circle cx="121" cy="-34" r="7"/>
      <circle cx="94" cy="48" r="6"/>
      <circle cx="24" cy="91" r="8"/>
      <circle cx="-49" cy="74" r="6"/>
      <circle cx="-112" cy="34" r="7"/>
    </g>

    <circle r="37" fill="#8B5CF6" opacity=".11" filter="url(#softGlow)">
      <animate attributeName="r" values="30;44;30" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".08;.22;.08" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="23" fill="#0D1427" stroke="url(#accent)" stroke-width="2"/>
    <circle r="5" fill="#22D3EE">
      <animate attributeName="r" values="4;7;4" dur="2.1s" repeatCount="indefinite"/>
    </circle>

    <circle r="5" fill="#22D3EE" filter="url(#tinyGlow)">
      <animateMotion dur="7s" repeatCount="indefinite" path="M -125 -42 L -55 -83 L 12 -61 L 77 -100 L 121 -34 L 94 48 L 24 91 L -49 74 L -112 34 L -125 -42"/>
    </circle>
    <circle r="4" fill="#F472B6" filter="url(#tinyGlow)">
      <animateMotion begin="-2.7s" dur="8.5s" repeatCount="indefinite" path="M 94 48 L -55 -83 L -112 34 L 24 91 L 94 48"/>
    </circle>
  </g>

  <!-- status chip -->
  <rect x="70" y="56" width="174" height="36" rx="18" fill="#0F172A" stroke="#334155"/>
  <circle cx="91" cy="74" r="5" fill="#22D3EE">
    <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="105" y="80" fill="#CBD5E1" font-size="14" font-weight="650" letter-spacing="1.2" font-family="Inter,Segoe UI,Arial,sans-serif">AI ENGINEER</text>

  <!-- identity -->
  <text x="70" y="169" fill="#F8FAFC" font-size="62" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.2">FATEMEH</text>
  <text x="70" y="232" fill="url(#accent)" font-size="62" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.2">DEHGHAN</text>

  <text x="73" y="281" fill="#D6E0EE" font-size="23" font-weight="550" font-family="Inter,Segoe UI,Arial,sans-serif">Turning AI prototypes into products.</text>
  <text x="73" y="318" fill="#7E8DA5" font-size="16" font-weight="500" font-family="Inter,Segoe UI,Arial,sans-serif">language models  ·  retrieval  ·  intelligent backends</text>

  <!-- animated signature line -->
  <path d="M73 365H592" stroke="#25304A" stroke-width="2" stroke-linecap="round"/>
  <path d="M73 365H222" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="36 113">
    <animate attributeName="stroke-dashoffset" values="0;-298" dur="4.6s" repeatCount="indefinite"/>
  </path>
  <text x="73" y="393" fill="#5F6F86" font-size="13" letter-spacing=".7" font-family="JetBrains Mono,Consolas,monospace">build  →  measure  →  improve  →  ship</text>
</g>

<rect x="1" y="1" width="1198" height="418" rx="27" stroke="url(#accent)" stroke-opacity=".32" stroke-width="2"/>
</svg>
