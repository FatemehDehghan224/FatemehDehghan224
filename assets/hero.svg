<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="80" y1="20" x2="1120" y2="410" gradientUnits="userSpaceOnUse">
    <stop stop-color="#070B16"/>
    <stop offset="0.48" stop-color="#10172C"/>
